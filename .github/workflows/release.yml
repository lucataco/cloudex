# Push a tag like v0.1.0 to release: the sandbox image goes to
# ghcr.io/lucataco/cloudex-base:<tag>, and CLI archives built against it go to
# a GitHub release, where https://cloudex.build/install downloads them.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: images/base
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/lucataco/cloudex-base:${{ github.ref_name }}
            ghcr.io/lucataco/cloudex-base:latest
          cache-from: type=gha

  cli:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: pnpm install --frozen-lockfile
      - run: scripts/build-cli.sh "${{ github.ref_name }}"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" dist/* --title "${{ github.ref_name }}" --generate-notes

# Push a tag like v0.1.0 to release: the sandbox image goes to
# ghcr.io/lucataco/cloudex-base:<tag>, and CLI archives built against it go to
# a GitHub release, where https://cloudex.build/install downloads them. Then
# the SDKs are published when their version is new: Python to PyPI, and the
# TypeScript SDK staged on npm for a maintainer to approve with
# `npm stage approve <id>`, which asks for 2FA.
#
# Both use trusted publishing, so no token is stored here. One-time setup:
#   npm:  npm trust github cloudex --file release.yml --repo lucataco/cloudex --env npm --allow-stage-publish
#   PyPI: a trusted publisher for the project cloudex on pypi.org: owner
#         lucataco, repository cloudex, workflow release.yml, environment pypi
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  # A fix release for an older version can be tagged after a newer release.
  # Only the newest version becomes GitHub's latest release,
  # which `cloudex update` and the install script read, the image's :latest
  # tag, and npm's latest tag.
  newest:
    runs-on: ubuntu-latest
    outputs:
      newest: ${{ steps.check.outputs.newest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          top=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ "$top" = "$GITHUB_REF_NAME" ]; then newest=true; else newest=false; fi
          echo "newest=$newest" >> "$GITHUB_OUTPUT"
          echo "::notice::$GITHUB_REF_NAME is newest=$newest (the newest tag is $top)"

  image:
    needs: newest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: images/base
          platforms: linux/amd64
          # A single image, not an index with an attestation, keeps the copy into
          # each account's registry simple.
          provenance: false
          push: true
          tags: |
            ghcr.io/lucataco/cloudex-base:${{ github.ref_name }}
            ${{ needs.newest.outputs.newest == 'true' && 'ghcr.io/lucataco/cloudex-base:latest' || '' }}
          cache-from: type=gha

  cli:
    needs: [newest, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: pnpm install --frozen-lockfile
      - run: scripts/build-cli.sh "${{ github.ref_name }}"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" dist/* --title "${{ github.ref_name }}" --generate-notes --latest="${{ needs.newest.outputs.newest }}"

  npm:
    needs: [newest, cli]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # npm stage needs a newer npm than Node 24 may come with.
      - run: npm install -g npm@11
      - name: Stage the SDK on npm
        working-directory: packages/sdk
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$(npm view "cloudex@$version" version 2>/dev/null)" = "$version" ]; then
            echo "cloudex@$version is already on npm"
            exit 0
          fi
          # An older version's SDK goes under its own dist-tag, like v0.1-lts.
          if [ "${{ needs.newest.outputs.newest }}" = true ]; then tag=latest; else tag="v${version%.*}-lts"; fi
          npm stage publish --access public --tag "$tag"
          echo "::notice::cloudex@$version is staged on npm; approve it with npm stage approve <id> (the id is in the log above)"

  pypi:
    needs: cli
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx run build --outdir dist python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # A release that doesn't change the Python SDK keeps its version.
          skip-existing: true

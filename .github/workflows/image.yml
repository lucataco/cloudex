# Builds the sandbox image when it changes, and publishes it from main as
# ghcr.io/lucataco/cloudex-base:edge (what dev builds of the CLI install).
# The node agent's image, ghcr.io/lucataco/cloudex-node:edge, the same way
# (what a dev deployment's install command runs). Releases publish versioned
# tags from release.yml.
name: Image

on:
  push:
    branches: [main]
    paths: ["images/**", "go/**", ".github/workflows/image.yml"]
  pull_request:
    paths: ["images/**", "go/**", ".github/workflows/image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: images/base
          platforms: linux/amd64
          # A single image, not an index with an attestation, keeps the copy into
          # each account's registry simple.
          provenance: false
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/lucataco/cloudex-base:edge
            ghcr.io/lucataco/cloudex-base:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: images/node/Dockerfile
          platforms: linux/amd64
          provenance: false
          build-args: VERSION=edge-${{ github.sha }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/lucataco/cloudex-node:edge
            ghcr.io/lucataco/cloudex-node:sha-${{ github.sha }}
          cache-from: type=gha,scope=node
          cache-to: type=gha,mode=max,scope=node

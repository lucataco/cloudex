# Builds the sandbox image when it changes, and publishes it from main as
# ghcr.io/lucataco/cloudex-base:edge (what dev builds of the CLI install).
# Releases publish versioned tags from release.yml.
name: Image

on:
  push:
    branches: [main]
    paths: ["images/**", ".github/workflows/image.yml"]
  pull_request:
    paths: ["images/**", ".github/workflows/image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: images/base
          platforms: linux/amd64
          # A single image, not an index with an attestation, keeps the copy into
          # each account's registry simple.
          provenance: false
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/lucataco/cloudex-base:edge
            ghcr.io/lucataco/cloudex-base:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
